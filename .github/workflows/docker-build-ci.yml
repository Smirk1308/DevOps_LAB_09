name: Docker Custom Image Build & Test CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Step 1 - Check Docker Daemon
        run: |
          docker --version
          docker ps

      - name: Step 6 - Build Custom Image (myapp:1.0)
        run: |
          docker build -t myapp:1.0 .

      - name: Step 7 - Verify Image in Docker Local Registry
        run: |
          docker images | grep myapp

      - name: Step 8 - Run Container from Custom Image
        run: |
          OUTPUT=$(docker run --name mycontainer myapp:1.0)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep "Hello Students!"
          echo "$OUTPUT" | grep "Welcome to Docker Experiment 9."
          echo "$OUTPUT" | grep "This application is running inside a Docker container."

      - name: Step 9 - Check Exited Status (Exited 0)
        run: |
          docker ps -a | grep mycontainer | grep "Exited (0)"

      - name: Step 10 - View Container Logs
        run: |
          docker logs mycontainer

      - name: Step 11 - Restart and Re-run Container
        run: |
          docker start -a mycontainer

      - name: Step 12 - Clean Up Container and Image
        run: |
          docker rm mycontainer
          docker rmi myapp:1.0
          docker images
